<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Phuoc Thinh Nguyen">
    <meta name="theme-color" content="#0f2027">
    <title>Hệ Thống Quản Lý Kế Hoạch Học Thuật</title>
    
    <script>
        const manifestJSON = {
            "name": "Sổ Nhật Trình Học Thuật",
            "short_name": "Kế Hoạch",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f2027",
            "theme_color": "#0f2027",
            "icons": [{
                "src": "https://cdn-icons-png.flaticon.com/512/2382/2382461.png",
                "sizes": "512x512",
                "type": "image/png"
            }]
        };
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestJSON));
        document.head.appendChild(manifestLink);
    </script>

    <style>
        :root {
            --primary: #4facfe;
            --secondary: #00f2fe;
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; transition: all 0.3s ease; }
        
        body { background: var(--bg-gradient); background-attachment: fixed; color: #fff; padding: 20px; margin: 0; min-height: 100vh; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--glass-border); }
        .header h2 { margin: 0; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        #installAppBtn { 
            display: none; padding: 10px 24px; background: linear-gradient(90deg, #11998e, #38ef7d); 
            color: white; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4); 
        }
        #installAppBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 239, 125, 0.6); }

        .week-container { display: flex; overflow-x: auto; gap: 25px; padding-bottom: 20px; scroll-behavior: smooth; }
        .week-container::-webkit-scrollbar { height: 10px; }
        .week-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .day-card { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 25px; border-radius: 20px; min-width: 360px; border: 1px solid var(--glass-border); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        
        .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .day-header h3 { margin: 0; font-size: 20px; color: #fff; }
        .add-task-btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .add-task-btn:hover { background: var(--primary); border-color: var(--primary); }
        
        .progress-container { width: 100%; background: rgba(0,0,0,0.3); border-radius: 10px; margin-bottom: 25px; height: 22px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 10px; }
        .progress-text { position: absolute; width: 100%; text-align: center; top: 0; font-size: 13px; line-height: 22px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        
        .task-list { min-height: 200px; }
        .task-item { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 15px; margin-bottom: 12px; border-radius: 12px; border-left: 4px solid var(--primary); }
        .task-item:hover { background: rgba(0,0,0,0.4); transform: translateX(5px); }
        .task-item.completed { border-left-color: #38ef7d; opacity: 0.6; }
        
        .task-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .task-info input[type="checkbox"] { appearance: none; width: 22px; height: 22px; border: 2px solid var(--primary); border-radius: 6px; cursor: pointer; position: relative; }
        .task-info input[type="checkbox"]:checked { background: #38ef7d; border-color: #38ef7d; }
        .task-info input[type="checkbox"]:checked::after { content: '✔'; position: absolute; color: white; font-size: 14px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        .task-time { color: var(--secondary); font-weight: bold; font-size: 15px; }
        .task-text { font-size: 15px; }
        .task-item.completed .task-text { text-decoration: line-through; }
        
        .task-actions button { background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0.5; }
        .task-actions button:hover { opacity: 1; transform: scale(1.2); }
        
        .complete-day-btn { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--glass-border); border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 20px; }
        .complete-day-btn:hover { background: rgba(255,255,255,0.15); box-shadow: 0 0 15px rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Không Gian Quản Lý Kế Hoạch</h2>
        <button id="installAppBtn">📲 Cài Đặt Ứng Dụng</button>
    </div>

    <div class="week-container" id="week-container"></div>

    <script>
        // --- LOGIC GIAO DIỆN & DỮ LIỆU ---
        const daysOfWeek = ['Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy', 'Chủ Nhật'];
        let tasksData = JSON.parse(localStorage.getItem('academicScheduleData')) || {};
        daysOfWeek.forEach(day => { if(!tasksData[day]) tasksData[day] = []; });

        function saveData() { localStorage.setItem('academicScheduleData', JSON.stringify(tasksData)); }

        function render() {
            const container = document.getElementById('week-container');
            container.innerHTML = '';
            
            daysOfWeek.forEach((day, index) => {
                const dayTasks = tasksData[day];
                const total = dayTasks.length;
                const completed = dayTasks.filter(t => t.done).length;
                const progressPct = total === 0 ? 0 : Math.round((completed / total) * 100);

                let html = `
                <div class="day-card">
                    <div class="day-header">
                        <h3>${day}</h3>
                        <button class="add-task-btn" onclick="addTask('${day}')">+ Thêm Tác Vụ</button>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${progressPct}%; ${progressPct === 100 ? 'background: linear-gradient(90deg, #11998e, #38ef7d);' : ''}"></div>
                        <div class="progress-text">${progressPct}% (${completed}/${total})</div>
                    </div>
                    <div class="task-list">
                `;
                
                dayTasks.forEach(task => {
                    html += `
                    <div class="task-item ${task.done ? 'completed' : ''}">
                        <div class="task-info">
                            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask('${day}', '${task.id}')">
                            <span class="task-time">${task.time}</span>
                            <span class="task-text">${task.text}</span>
                        </div>
                        <div class="task-actions">
                            <button onclick="editTask('${day}', '${task.id}')" title="Chỉnh sửa">✏️</button>
                            <button onclick="deleteTask('${day}', '${task.id}')" title="Xóa">🗑️</button>
                        </div>
                    </div>
                    `;
                });

                html += `
                    </div>
                    <button class="complete-day-btn" onclick="completeDay('${day}', ${index})">Xác Nhận Tổng Kết Ngày</button>
                </div>
                `;
                container.innerHTML += html;
            });
        }

        function addTask(day) {
            const time = prompt(`Nhập khung giờ thực hiện (HH:MM):`);
            if (!time) return;
            const text = prompt('Nhập nội dung tác vụ:');
            if (!text) return;
            tasksData[day].push({ id: Date.now().toString(), time: time, text: text, done: false });
            tasksData[day].sort((a, b) => a.time.localeCompare(b.time));
            saveData(); render();
        }

        function toggleTask(day, id) {
            const task = tasksData[day].find(t => t.id === id);
            if(task) { task.done = !task.done; saveData(); render(); }
        }

        function editTask(day, id) {
            const task = tasksData[day].find(t => t.id === id);
            if(task) {
                const newTime = prompt('Cập nhật khung giờ:', task.time);
                if(newTime) task.time = newTime;
                const newText = prompt('Cập nhật nội dung:', task.text);
                if(newText) task.text = newText;
                tasksData[day].sort((a, b) => a.time.localeCompare(b.time));
                saveData(); render();
            }
        }

        function deleteTask(day, id) {
            if(confirm('Bạn có chắc chắn muốn xóa tác vụ này?')) { 
                tasksData[day] = tasksData[day].filter(t => t.id !== id); 
                saveData(); render(); 
            }
        }

        function completeDay(day, index) {
            const incompleteTasks = tasksData[day].filter(t => !t.done);
            if (incompleteTasks.length > 0) {
                if (confirm(`Còn ${incompleteTasks.length} tác vụ chưa hoàn thành. Bạn có muốn hệ thống tự động dời sang ngày tiếp theo không?`)) {
                    const nextDay = daysOfWeek[(index + 1) % 7];
                    tasksData[nextDay].push(...incompleteTasks);
                    tasksData[nextDay].sort((a, b) => a.time.localeCompare(b.time));
                    tasksData[day] = tasksData[day].filter(t => t.done);
                    saveData(); render();
                    alert(`Đã chuyển tiếp tác vụ thành công sang ${nextDay}.`);
                }
            } else {
                alert('Tuyệt vời! Toàn bộ lịch trình trong ngày đã được hoàn tất.');
            }
        }

        window.onload = render;

        // --- PWA: KÍCH HOẠT NÚT TẢI APP ---
        // Tạo ảo Service Worker để vượt qua kiểm duyệt tải App của trình duyệt
        const swCode = `self.addEventListener('fetch', () => {});`;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl).catch(() => console.log('SW chạy nền chờ GitHub Pages.'));
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
